<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#070204;--wine:#5a0f1f;--red:#8b1a2b;--rose:#c4465c;--cream:#efe3d3;--p:0;--d:1;
--display:'Cormorant SC','Palatino Linotype',Georgia,serif;--body:'EB Garamond',Georgia,'Times New Roman',serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--cream);font-family:var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ---------- ФОН ---------- */
.heart-bg{position:fixed;inset:0;display:grid;place-items:center;z-index:0;pointer-events:none;
 opacity:calc((.13 + var(--p)*.24)*var(--d));transform:scale(calc(.9 + var(--p)*.25));transition:opacity 1s linear}
.heart-bg svg{width:min(92vw,95vh);filter:blur(3px) drop-shadow(0 0 70px #6a0f22);animation:beat 7s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1);opacity:.85}45%{transform:scale(1.06);opacity:1}}
.glow{position:fixed;inset:0;z-index:1;pointer-events:none;
 background:radial-gradient(ellipse at 50% 105%,rgba(139,26,43,.55),transparent 60%),radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,.75) 100%);
 opacity:calc((.25 + var(--p)*.75)*var(--d))}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}
.vine{position:fixed;top:0;height:100vh;width:min(20vh,30vw);z-index:2;pointer-events:none;overflow:hidden;opacity:.9;
 animation:sway 11s ease-in-out infinite;transform-origin:50% 100%}
.vine.l{left:0}.vine.r{right:0;transform:scaleX(-1);animation-delay:-5s}
@keyframes sway{0%,100%{rotate:-.7deg}50%{rotate:.7deg}}
.vine path.main{fill:none;stroke:#2b0a10;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 2.4s ease-out}
.vine .it{transition:opacity 2s ease;opacity:0}
.vine .thorn{fill:#1c0609;stroke:#6e1124;stroke-width:.4}
.vine .branch{fill:none;stroke:#2b0a10;stroke-width:1.6;stroke-linecap:round}
.vine .rose{animation:rsway 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rsway{0%,100%{rotate:-5deg}50%{rotate:5deg}}

/* ---------- ТЕКСТ ---------- */
main{position:relative;z-index:3}
section{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
 text-align:center;padding:12vh clamp(1.4rem,9vw,7rem)}
.w{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(6px);
 transition:opacity 2s ease,transform 2s ease,filter 2s ease}
.in .w{opacity:1;transform:none;filter:none}
.reveal{opacity:0;transition:opacity 2.4s ease}.reveal.in{opacity:1}
.shadowed{text-shadow:0 0 22px #000,0 0 8px #000}

html.locked,html.locked body{overflow:hidden}
#num20{position:fixed;inset:0;z-index:1;display:grid;place-items:center;pointer-events:none;user-select:none;
 font-family:'Cinzel','Trajan Pro','Times New Roman',serif;font-weight:600;font-size:min(62vw,66vh);line-height:1;
 color:#6e1124;opacity:0;transition:opacity 2.4s ease;will-change:transform,filter}
#intro{position:fixed;inset:0;z-index:6;background:rgba(5,1,3,.55);transition:opacity 3s ease}
#intro.out{opacity:0;pointer-events:none}
#introCv{position:absolute;inset:0;width:100%;height:100%}
#num19{position:absolute;translate:-50% -50%;background:none;border:0;border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent}
#num19:focus-visible{outline:1px solid var(--red)}
.cap{position:absolute;left:0;right:0;text-align:center;padding:0 1.5rem;font-style:italic;letter-spacing:.1em;color:#c9a79b}
#clickHint{font-size:clamp(1.15rem,3.4vw,1.6rem);transition:opacity 1.2s}
#clickHint span{display:inline-block;animation:bob 3.2s ease-in-out infinite}
#clickHint.gone{opacity:0}
#welcome{font-size:clamp(1.5rem,4.6vw,2.6rem);color:var(--cream);opacity:0;transition:opacity 2.6s ease;text-shadow:0 0 26px rgba(139,26,43,.95)}
#welcome.in{opacity:1}
.hint{position:fixed;z-index:4;bottom:max(2.2rem,env(safe-area-inset-bottom));left:0;right:0;text-align:center;pointer-events:none;
 font-style:italic;color:#a88a7a;letter-spacing:.12em;font-size:1.05rem;opacity:0;transition:opacity 1.4s}
.hint.on{opacity:1}
.hint span{display:inline-block;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(9px);opacity:1}}
.wish.short{min-height:70vh}
.wish.short p{font-size:clamp(1.9rem,5.2vw,3.4rem)}
#final{min-height:125vh}
#final .w{transition-duration:3.6s}
#fade{min-height:150vh}
#heartCanvas{opacity:0;transition:opacity 1.8s ease}
#heartCanvas.on{opacity:1}
#scene:not(.signon) #sign{opacity:0}
#sign{bottom:max(5%,2rem)}
#subBox{position:fixed;left:0;right:0;top:var(--subs-top,56%);translate:0 -50%;z-index:5;pointer-events:none;display:flex;flex-direction:column;
 align-items:center;gap:.55em;padding:0 clamp(1.4rem,9vw,7rem);text-align:center;font-style:italic;font-size:clamp(1.5rem,3.8vw,2.6rem);
 line-height:1.45;letter-spacing:.05em;color:#f1e6d6;transition:top 1.8s ease,font-size 1.8s ease;
 text-shadow:0 0 18px rgba(139,26,43,.85),0 0 42px rgba(139,26,43,.55),0 0 6px #000}
html.heart-on #subBox{font-size:clamp(1.1rem,2.7vw,1.75rem);color:rgba(226,210,190,.86);text-shadow:0 0 14px rgba(139,26,43,.8),0 0 5px #000}
.sub{display:grid;max-width:26em}
.sub .slot{grid-area:1/1;align-self:center}
.sub .slot.small{font-size:.74em;color:rgba(226,210,190,.72)}
.sub .w{transform:translateY(10px);filter:blur(5px);transition-duration:1.1s}
.sub .slot.in .w{opacity:1;transform:none;filter:none}
.sub .slot.out .w{opacity:0;transform:translateY(-6px);filter:blur(3px);transition-duration:.8s;transition-delay:0s!important}
.slot[data-anim=fade]:not(.in):not(.out) .w{transform:none;filter:none}
.slot[data-anim=rise]:not(.in):not(.out) .w{filter:none}
.slot[data-anim=blur]:not(.in):not(.out) .w{transform:none}
.slot[data-anim=spacing]{letter-spacing:.22em;transition:letter-spacing 6s ease-out}
.slot[data-anim=spacing].in{letter-spacing:.05em}
#musicBtn{position:fixed;z-index:7;left:50%;bottom:max(2.4rem,env(safe-area-inset-bottom));translate:-50% 0;background:none;
 border:1px solid rgba(139,26,43,.75);color:#c9a79b;font:italic 1.1rem var(--body);letter-spacing:.12em;padding:.7rem 1.6rem;
 border-radius:2rem;cursor:pointer;opacity:.75;transition:opacity .4s;max-width:90vw}
#musicBtn:hover{opacity:1}#musicBtn[hidden]{display:none}
#devp{position:fixed;z-index:30;top:.5rem;left:.5rem;display:flex;flex-direction:column;gap:4px;padding:6px;background:rgba(0,0,0,.75);
 border:1px solid #5a0f1f;font:12px sans-serif;color:#ddd}
#devp button{font:12px sans-serif;background:#2a0a10;color:#eee;border:1px solid #5a0f1f;padding:4px 8px;cursor:pointer}
/* Ликорисы: смешиваются с чёрным фоном (screen), края растушёваны в самой картинке */
#lycoris{position:fixed;z-index:1;pointer-events:none;right:-10vw;top:-3vh;height:106vh;aspect-ratio:2/3;opacity:0;
 mix-blend-mode:screen;transition:opacity 2.6s ease;will-change:transform,opacity}
#lycoris::before{content:"";position:absolute;inset:-10%;filter:blur(32px);
 background:radial-gradient(ellipse 55% 50% at 62% 40%,rgba(139,26,43,.4),transparent 70%)}
#lycoris img{position:relative;display:block;width:100%;height:100%;opacity:.5;
 animation:lyfloat 40s ease-in-out infinite,lybreathe 16s ease-in-out infinite}
@keyframes lyfloat{0%,100%{transform:translate3d(0,-6px,0) scale(1)}50%{transform:translate3d(0,8px,0) scale(1.02)}}
@keyframes lybreathe{0%,100%{filter:brightness(.88)}50%{filter:brightness(1.1)}}
@media (max-aspect-ratio:1/1){#lycoris{height:78vh;top:auto;bottom:-6vh;right:-26vw}#lycoris img{opacity:.38}}
@media (max-width:700px){#lycoris{height:66vh;right:-30vw}#lycoris img{opacity:.3}}

.wish p{font-size:clamp(1.45rem,3.8vw,2.55rem);line-height:1.5;font-style:italic;max-width:24em;color:var(--cream)}
.wish .mark{font-size:1.5rem;color:var(--red);margin-bottom:2rem;transition:opacity 2.4s}
figure.photo{margin-bottom:2.4rem;padding:9px;border:1px solid var(--red);background:#0d0306;
 box-shadow:0 0 50px rgba(139,26,43,.45);width:min(72vw,340px)}
figure.photo img{width:100%;display:block;filter:sepia(.5) contrast(1.05) brightness(.9)}

#final .lines p{font-size:clamp(1.5rem,4.2vw,2.8rem);line-height:1.55;font-style:italic;margin:.15em 0}
#final .lines .big{font-family:var(--display);font-style:normal;font-weight:700;letter-spacing:.06em;
 font-size:clamp(2.1rem,6.5vw,4.4rem);margin-top:1.6rem;color:#f4e8d8;text-shadow:0 0 30px rgba(196,70,92,.7)}

#scene{position:relative;padding:0;min-height:100vh;min-height:100svh}
#heartCanvas{position:absolute;inset:0;width:100%;height:100%}
#sign{position:absolute;bottom:max(7%,2.5rem);left:0;right:0;font-family:var(--display);font-weight:500;
 font-size:clamp(1.6rem,4.5vw,2.6rem);letter-spacing:.14em;color:var(--cream);text-shadow:0 0 24px var(--red)}
noscript{position:fixed;inset:0;z-index:9;background:#070204;display:grid;place-items:center;padding:2rem;text-align:center;font-size:1.4rem}

@media (prefers-reduced-motion:reduce){.vine,.vine .rose,.heart-bg svg,.hint,#lycoris img{animation:none}.w,.reveal{transition-duration:.4s}}
</style>
</head>

      ctx.globalAlpha = a; ctx.font = `600 ${q.size}px 'EB Garamond',Georgia,serif`;
      ctx.shadowColor = q.color; ctx.shadowBlur = 12; ctx.fillStyle = q.color; ctx.fillText(q.word, q.x, q.y);
    }
    if (cp > 0) {                                       // центральная надпись
      const pulse = 1 + .025 * Math.sin(frame * .05);
      ctx.globalAlpha = 1 - Math.exp(-cp * 8); ctx.shadowColor = '#c4243f'; ctx.shadowBlur = 28;
      ctx.fillStyle = '#f4e8d8'; ctx.font = `700 ${S * 2.6 * pulse}px 'Cormorant SC',Georgia,serif`;
      ctx.fillText(HEART_CENTER, W / 2, H * .46);
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    if (!signShown && frame > centerStart + 120) { signShown = true; $('#sign').classList.add('in'); }
    requestAnimationFrame(draw);
  }
  build(false);
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => build(frame > centerStart + 200), 200); });
  // Запуск сердца теперь управляется таймлайном финала (см. «ФИНАЛЬНАЯ СЦЕНА» ниже):
  // HeartControl.show() — запустить анимацию с начала, HeartControl.hide() — плавно убрать.
  let hideT;
  window.HeartControl = {
    get active() { return running; },
    show() {
      clearTimeout(hideT);
      if (running) { cv.classList.add('on'); return; }
      frame = 0; signShown = false; $('#sign').classList.remove('in');
      build(false); cv.classList.add('on'); running = true; last = performance.now(); requestAnimationFrame(draw);
    },
    hide() { cv.classList.remove('on'); clearTimeout(hideT); hideT = setTimeout(() => { running = false; }, 1900); }
  };
})();

/* =====================================================================
   МУЗЫКА (управление аудио)
   Music.play() / pause() / seek(сек) / time / setVolume(0…1) / fadeTo(v, мс) / fadeIn() / fadeOut()
   ===================================================================== */
const Music = (function () {
  const el = new Audio(); el.preload = 'auto'; el.loop = false; el.src = MUSIC_SRC; el.volume = 0;
  let vol = 0, tok = 0, unlocked = false, failed = false, gain = null, actx = null;
  // На iPhone громкость у <audio> менять нельзя — тогда используем Web Audio
  const canVol = (() => { el.volume = .5; const ok = Math.abs(el.volume - .5) < .01; el.volume = 0; return ok; })();
  el.addEventListener('error', () => { failed = true; });
  function ensureGain() {
    if (canVol || gain) return;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      gain = actx.createGain(); gain.gain.value = 0;
      actx.createMediaElementSource(el).connect(gain); gain.connect(actx.destination);
    } catch (e) { gain = null; }
  }
  function apply(v) { vol = clamp(v, 0, 1); if (gain) gain.gain.value = vol; else el.volume = vol; }
  function fadeTo(target, ms) {
    const my = ++tok, from = vol, t0 = performance.now();
    return new Promise(res => (function step(now) {
      if (my !== tok) return res(false);
      const k = ms > 0 ? clamp((now - t0) / ms, 0, 1) : 1, e = k * k * (3 - 2 * k);
      apply(from + (target - from) * e);
      k < 1 ? requestAnimationFrame(step) : res(true);
    })(t0));
  }
  return {
    el,
    get time() { return el.currentTime; },
    get duration() { return el.duration; },
    get failed() { return failed; },
    // Вызывается по клику на «19»: «разблокирует» звук, но ничего не играет вслух
    unlock() {
      if (unlocked) return; unlocked = true; ensureGain(); if (actx) actx.resume();
      el.muted = true;
      const p = el.play();
      if (p && p.then) p.then(() => { el.pause(); el.currentTime = 0; el.muted = false; }).catch(() => { el.muted = false; unlocked = false; });
    },
    async play() { ensureGain(); if (actx) actx.resume(); el.muted = false; apply(vol); try { await el.play(); return true; } catch (e) { return false; } },
    pause() { el.pause(); },
    seek(s) { el.currentTime = s; },
    setVolume(v) { tok++; apply(v); },
    fadeTo,
    fadeIn() { tok++; apply(0); return fadeTo(MUSIC_TARGET_VOLUME, MUSIC_FADE_IN_DURATION); },
    fadeOut() { return fadeTo(0, MUSIC_FADE_OUT_DURATION).then(ok => { if (ok) el.pause(); }); }
  };
})();

/* =====================================================================
   ФИНАЛЬНАЯ СЦЕНА — музыка, субтитры и сердце по единому таймлайну (TIMELINE)
   Источник времени — Music.time (audio.currentTime). Пауза аудио = пауза таймлайна.
   Всё состояние считается от текущего времени, поэтому перемотка работает.
   ===================================================================== */
(function () {
  const root = document.documentElement, scene = $('#scene'), btn = $('#musicBtn');
  const ACTIONS = ['subtitle', 'heart-start', 'heart-stop', 'heart-permanent', 'volume', 'music-fadeout'];
  const events = TIMELINE.filter(e => {
    const ok = e && ACTIONS.includes(e.action) && typeof e.time === 'number';
    if (!ok) console.warn('TIMELINE: неверное событие', e); return ok;
  }).sort((a, b) => a.time - b.time);
  const subs = events.filter(e => e.action === 'subtitle');
  const listMain = subs.filter(e => (e.track || 'main') === 'main'), listEcho = subs.filter(e => e.track === 'echo');
  const heartEv = events.filter(e => e.action.startsWith('heart-'));
  const volEv = events.filter(e => e.action === 'volume' || e.action === 'music-fadeout');
  const endOf = (list, e, i) => e.end ?? (e.duration ? e.time + e.duration : (list[i + 1] ? list[i + 1].time : e.time + 6));
  const lastEnd = Math.max(0, ...[listMain, listEcho].flatMap(l => l.map((e, i) => endOf(l, e, i))));
  const idxAt = (list, t) => { let k = -1; list.forEach((e, i) => { if (t >= e.time && t < endOf(list, e, i)) k = i; }); return k; };
  let started = false, heart = 'hidden', lastT = 0, fadeInDone = false;
  root.style.setProperty('--subs-top', SUBTITLE_TOP);

  $('#num19').addEventListener('click', () => Music.unlock());   // клик по «19» готовит звук (в тишине)

  // Дорожка субтитров из двух «слотов»: старая строка уходит (чёткая → размытая, гаснет),
  // в тот же момент новая появляется (размытая → чёткая, поднимается). Так даже строки с разницей в 0.01 с читаются.
  function makeTrack(host, list) {
    const slots = [0, 1].map(() => { const d = document.createElement('div'); d.className = 'slot'; host.appendChild(d); return d; });
    let idx = -1, act = 0; const timers = [0, 0];
    return {
      get idx() { return idx; },
      set(i, small) {
        if (i === idx) return; idx = i;
        const old = slots[act];
        if (old.firstChild) {
          old.classList.remove('in'); old.classList.add('out'); clearTimeout(timers[act]);
          timers[act] = setTimeout(() => { old.innerHTML = ''; old.className = 'slot'; }, 1000);
        }
        if (i < 0) return;
        act ^= 1; const s = slots[act]; clearTimeout(timers[act]);
        s.className = 'slot' + (small ? ' small' : ''); s.dataset.anim = list[i].anim || SUBTITLE_ANIM;
        s.innerHTML = words(list[i].text, .05); void s.offsetWidth; s.classList.add('in');
      }
    };
  }
  const trMain = makeTrack($('#subs'), listMain), trEcho = makeTrack($('#subs2'), listEcho);

  // Сердце: heart-start / heart-stop / heart-permanent. После permanent остановки игнорируются.
  function applyHeart(t) {
    let st = 'hidden';
    for (const e of heartEv) {
      if (e.time > t) break;
      if (e.action === 'heart-permanent') { st = 'permanent'; break; }
      st = e.action === 'heart-start' ? 'shown' : 'hidden';
    }
    if (st === heart) return; heart = st;
    root.classList.toggle('heart-on', st !== 'hidden');
    root.style.setProperty('--subs-top', st === 'hidden' ? SUBTITLE_TOP : SUBTITLE_TOP_WITH_HEART);
    st === 'hidden' ? HeartControl.hide() : HeartControl.show();
  }
  // Громкость: обычные события срабатывают один раз; при перемотке громкость восстанавливается по времени
  function applyVolume(t, jumped) {
    if (jumped) {
      if (!fadeInDone) return;
      let v = MUSIC_TARGET_VOLUME, off = false;
      for (const e of volEv) { if (e.time > t) break; if (e.action === 'volume') { v = e.volume; off = false; } else off = true; }
      Music.setVolume(off ? 0 : v); return;
    }
    for (const e of volEv) if (lastT < e.time && e.time <= t) e.action === 'volume' ? Music.fadeTo(e.volume, e.duration || 0) : Music.fadeOut();
  }
  function tick() {
    const t = Music.time, jumped = Math.abs(t - lastT) > 1.5;
    applyHeart(t);
    trMain.set(idxAt(listMain, t), false);
    trEcho.set(idxAt(listEcho, t), trMain.idx >= 0);       // эхо-строка мельче, пока над ней идёт основная
    scene.classList.toggle('signon', heart === 'permanent' && t >= lastEnd + 1);   // «С любовью.» — когда текст закончился
    applyVolume(t, jumped);
    lastT = t; requestAnimationFrame(tick);
  }
  function begin() {
    started = true; btn.hidden = true; root.classList.add('locked');   // на время финала прокрутка заблокирована
    lastT = Music.time; fadeInDone = false; Music.fadeIn().then(ok => { if (ok) fadeInDone = true; }); tick();
  }
  async function startFinal() {
    if (started) return;
    if (Music.failed) { btn.textContent = MUSIC_ERR_TEXT; btn.hidden = false; btn.onclick = () => location.reload(); return; }
    if (MUSIC_START_AT > 0) Music.seek(MUSIC_START_AT);
    if (await Music.play()) return begin();
    btn.textContent = MUSIC_BTN_TEXT; btn.hidden = false;           // автозапуск запрещён — ненавязчивая кнопка
    btn.onclick = async () => { if (await Music.play()) begin(); };
  }
  // Финал начинается, когда «20» ушло в фон и экран стал тёмным (конец страницы)
  new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && introDone && !started) startFinal(); }), { threshold: .4 }).observe(scene);
  window.FinalScene = { startFinal };

  // Помощник для настройки таймингов: открой сайт с #dev в конце адреса (index.html#dev)
  if (location.hash === '#dev') {
    const d = document.createElement('div'); d.id = 'devp';
    d.innerHTML = '<div id="devt">Время: 0.00 с</div><button data-a="skip">Быстро к финалу</button><button data-a="-5">−5 с</button><button data-a="+5">+5 с</button><button data-a="to">К 1:20</button><button data-a="to2">К 2:25</button><button data-a="pp">Пауза / Играть</button><button data-a="copy">Копировать время</button>';
    document.body.appendChild(d);
    d.addEventListener('click', e => {
      const a = e.target.dataset.a; if (!a) return;
      if (a === 'skip') { $('#num19').click(); setTimeout(() => scrollTo(0, 1e7), 11500); }
      else if (a === 'pp') Music.el.paused ? Music.play() : Music.pause();
      else if (a === 'to') Music.seek(80); else if (a === 'to2') Music.seek(145);
      else if (a === 'copy') navigator.clipboard && navigator.clipboard.writeText(Music.time.toFixed(2));
      else Music.seek(Math.max(0, Music.time + parseFloat(a)));
    });
    setInterval(() => { $('#devt').textContent = 'Время: ' + Music.time.toFixed(2) + ' с'; }, 100);
  }
})();
</script>
